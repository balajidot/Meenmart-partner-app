name: meenmart_store
description: "MeenMart Partner — Store, Delivery & Marketing Operations (Pazhaverkadu)"
publish_to: 'none'

version: 2.1.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.1
  flutter_riverpod: ^3.3.1
  go_router: ^17.4.0
  google_fonts: ^8.1.0
  cached_network_image: ^3.4.1
  intl: ^0.20.3
  shared_preferences: ^2.3.2
  audioplayers: 6.1.1
  riverpod_annotation: ^4.0.2
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  permission_handler: ^11.3.1
  geolocator: ^13.0.2
  flutter_dotenv: ^5.2.1
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/store_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/store_logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icons/splash_logo.png"
  color_dark: "#FFFFFF"
  image_dark: "assets/icons/splash_logo.png"
  android_gravity: center
  fullscreen: true
  android_12:
    image: "assets/icons/splash_logo.png"
    icon_background_color: "#FFFFFF"
    color: "#FFFFFF"
    color_dark: "#FFFFFF"
